name: paywin-test
# запускать командой 
# docker compose -f compose.test.yml up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_NAME: Paywin
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stack
      LOG_STACK: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: paywin_test
      DB_USERNAME: paywin_test
      DB_PASSWORD: paywin_test
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      TIPTOPPAY_PUBLIC_ID: test
      TIPTOPPAY_PASSWORD: test
      TIPTOPPAY_URL: http://localhost
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: paywin_test
      MYSQL_USER: paywin_test
      MYSQL_PASSWORD: paywin_test
      MYSQL_ROOT_PASSWORD: paywin_root_test
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -upaywin_test -ppaywin_test --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - paywin_test_mysql:/var/lib/mysql

volumes:
  paywin_test_mysql:
